name: 同步 GitHub 项目数据

# 项目列表在构建时抓取并写成静态内容，访客浏览器不再调用 GitHub API：
# 没有 60 次/小时限流，也不需要反爬检测。

on:
  schedule:
    - cron: "17 3 * * *" # 每天 03:17 UTC（北京时间 11:17）
  workflow_dispatch: # 也可以在 Actions 页面手动触发
  push:
    branches: [main]
    # 只监听构建逻辑本身；构建产物（index.html / assets/**）不触发，
    # 否则机器人提交会自己触发自己，形成循环
    paths:
      - "scripts/**"
      - ".github/workflows/update-repos.yml"

permissions:
  contents: write

concurrency:
  group: update-repos
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成项目数据与静态卡片
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build.py

      - name: 有变更则提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据和页面都没有变化，跳过提交"
          else
            git commit -m "chore: 同步 GitHub 项目数据 [skip ci]"
            git push
          fi
